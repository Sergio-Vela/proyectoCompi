<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Vela Query Language (VQL) Workspace</title>

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Work+Sans:ital,wght@0,100..900;1,100..900&family=Fira+Code:wght@300..700&display=swap"
        rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <link href="css/styles2.css" rel="stylesheet" />
</head>

<body>

    <header>
        <div class="header-brand">
            <h1>Vela Query Language VQL</h1>
        </div>
    </header>

    <div class="app-container">

        <aside>

            <div class="sidebar-header">
                <div class="engine-status">
                    <div class="engine-icon">
                        <span class="material-symbols-outlined" style="font-size: 14px;">database</span>
                    </div>
                    <div class="engine-info">
                        <div class="name">Bases de datos</div>
                    </div>
                </div>
                <button id="btnRecargarSidebar" class="engine-icon">
                    <span class="material-symbols-outlined" style="font-size:16px;">refresh</span>
                </button>
            </div>

            <nav class="sidebar-nav"></nav>

        </aside>

        <main>

            <!-- EDITOR -->
            <div class="workspace-top">
                <section class="editor-panel">

                    <div class="panel-header">
                        <span class="label">Consulta</span>

                        <div style="display: flex; gap: 8px;">
                            <input id="archivoSQL" type="file" style="display:none;" />

                            <button id="btnSubir" class="btn-small">
                                <span class="material-symbols-outlined" style="font-size: 16px;">upload_file</span>
                                Subir archivo
                            </button>

                            <button id="btnEjecutar" class="btn-run-accent">
                                Ejecutar
                            </button>
                        </div>
                    </div>

                    <div class="editor-container">
                        <div class="code-area">
                            <div class="gutter mono">
                                <span>1</span>
                            </div>

                            <div id="editor" class="editable mono" contenteditable="true" spellcheck="false"></div>
                        </div>
                    </div>

                </section>
                <!-- ERRORES -->
                <section class="console-panel">
                    <div class="panel-header">
                        <span class="label">
                            <span class="material-symbols-outlined text-error" style="font-size: 14px;">warning</span>
                            Panel de errores
                        </span>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>No.</th>
                                    <th>linea</th>
                                    <th>columna</th>
                                    <th>valor</th>
                                    <th>comentario</th>
                                </tr>
                            </thead>

                            <tbody id="tbodyErrores"></tbody>

                        </table>
                    </div>
                </section>
            </div>

            <!-- RESULTADO -->
            <div class="workspace-middle">
                <section class="results-panel">
                    <div class="panel-header primary-header">
                        <span class="label">Resultado</span>
                    </div>

                    <div class="table-container no-scrollbar">
                        <div id="resultado" class="mono" style="padding:10px;"></div>
                    </div>
                </section>
            </div>

        </main>
    </div>

    <footer>
        <div class="footer-left">
            <div class="footer-item">
                <span class="material-symbols-outlined" style="font-size: 14px;">list_alt</span>
                <span id="contadorErrores">Items: 0</span>
            </div>
        </div>
    </footer>

    <script src="js/leerArchivo2.js"></script>

</body>

</html>
